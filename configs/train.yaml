# configs/train.yaml - EVERY parameter of the MeshTalk voice-SOS training.
# All scripts read this file (kws/cfg.py); there are no other magic numbers.
# TRAINING.md explains every value (in Chinese).

seed: 20261022                 # global seed; every random choice derives from it

paths:
  raw: data/raw                # downloads, as they come (not in git)
  cache: data/cache            # prepared clips / noise banks (not in git)
  models: models               # best.pt and training logs (in git)
  out: out                     # kws_model.c / kws_model_test.c (in git)
  docs: docs                   # PNG figures (in git)

labels: ["help", "help me", "sos", "_other"]   # output order of the network (CONTRACT 3)

# ------------------------------------------------- Phase C (r4): own recordings
# The owner's recordings from MeshTalk DataRec v1.0 (the device microphone, the
# exact signal Voice SOS hears). Imported by scripts/04_import_own.py into
# data/own (NOT in git: the repository is public and these are a real voice).
own:
  dir: data/own                # imported clips + manifest.csv
  categories:                  # DataRec folder -> network label
    HELP: help
    HELPME: help me
    SOS: sos
    COUGH: _other              # (DataRec v1.0 records only the three keywords;
    THROAT: _other             #  these folders are accepted if they ever appear)
    BREATH: _other
    LAUGH: _other
    WORDS: _other
    CHATEN: _other
    CHATZH: _other
    NOISE: _other
  rate: 16000                  # DataRec writes 16 kHz / 16 bit / mono WAV; anything else is skipped
  min_clips_per_speaker: 30    # a speaker with fewer clips goes to test as a whole (unseen speaker)
  test_pct: 20                 # the others: per file (hash of the file name)
  val_pct: 10

# ---------------------------------------------------------------- Step 1: data
sources:
  mswc:                        # Multilingual Spoken Words Corpus, English, CC-BY 4.0
    licence: CC-BY 4.0
    splits_url: https://storage.googleapis.com/public-datasets-mswc/splits/en.tar.gz
    splits_md5_b64: UzZXFbKRyrUOpCZS3AXQ/A==          # 778 269 141 bytes
    audio_url: https://storage.googleapis.com/public-datasets-mswc/audio/en.tar.gz
    audio_md5_b64: frXtC6JWYfxI/v9miaKO7A==           # 34 846 172 764 bytes, streamed, only the selected clips are kept
    keyword_words: [help]      # all clips of these words are kept (MSWC has no "me" and no "sos": words < 3 letters are not in MSWC)
    lookalike_words: [hello, helped, helps, helping, helpful, helen, held, health, self, hell, helm, kelp,
                      yelp, ask, yes, also, please, hey, stop, save, fire, emergency, mayday,
                      boss, loss, cross, toss, sauce, moss, hollow, salsa]
    lookalike_max_per_word: 1500
    random_other_clips: 30000  # random clips of all other words (_other)
    spk_speakers: 4000         # speakers kept for the speaker head (most clips first, then by hash)
    spk_min_clips: 25          # a speaker needs at least this many valid clips
    spk_clips_per_speaker: 25  # clips kept per speaker
  librispeech:                 # LibriSpeech with word alignments (MFA), CC-BY 4.0
    licence: CC-BY 4.0
    hf_repo: gilkeyio/librispeech-alignments
    train_subsets: [train_clean_100, train_clean_360, train_other_500]   # streamed shard by shard, parquet deleted afterwards
    eval_subsets: [dev_clean, dev_other, test_clean, test_other]  # kept whole: running speech for false alarms
    context_s: 0.30            # audio kept before / after a cut word
    keyword_words: [help]      # every occurrence; "help" directly followed by "me" -> real "help me"
    # shares below are chosen by a hash of utterance + word position (same on every run)
    me_keep_frac: 0.25         # share of "me" occurrences kept (to join with the same speaker's "help")
    lookalike_keep_frac: 0.5   # share of look-alike words (mswc.lookalike_words) kept
    spk_word_keep_frac: 0.025  # share of other words >= spk_word_min_s kept (speaker head, _other)
    spk_word_min_s: 0.35
    other_chunks_per_utt: 0.15 # share of utterances giving one random running-speech chunk (_other)
    chunk_s: 1.5
    subset_overrides:          # train-other-500 (added in v2): mainly more running speech for _other
      train_other_500: {other_chunks_per_utt: 0.25, chunk_s: 2.0, spk_word_keep_frac: 0.0}
  speech_commands:             # Google Speech Commands v0.02, CC-BY 4.0
    licence: CC-BY 4.0
    url: https://storage.googleapis.com/download.tensorflow.org/data/speech_commands_v0.02.tar.gz
    md5_b64: a3TzkBIUyywpNOmBloKYNQ==                  # 2 428 923 189 bytes
    other_clips: 15000         # random word clips for _other (all 35 words are non-keywords)
  esc50:                       # ESC-50 environmental sounds, CC-BY-NC 3.0 (HuggingFace mirror, GitHub zip is blocked here)
    licence: CC-BY-NC 3.0
    hf_repo: ashraq/esc50
    test_fold: 5               # fold 5 -> false-alarm test, folds 1-4 -> training noise
  musan:                       # MUSAN noise + music, CC-BY 4.0 (speech part not used)
    licence: CC-BY 4.0 (noise/music files individually CC / public domain, see MUSAN README)
    url: https://www.openslr.org/resources/17/musan.tar.gz
    keep: [noise, music]
    music_keep_frac: 0.30      # share of music files kept (disk space); noise: all
    test_pct: 25               # % of files (by hash) reserved for the false-alarm test
  kokoro:                      # Kokoro-82M TTS, Apache-2.0 (kokoro-onnx)
    licence: Apache-2.0
    model_url: https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
    voices_url: https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin

prepare:                       # scripts/02_prepare.py
  min_rms_db: -60              # clips quieter than this (dB re full scale) are dropped
  span_rel_db: -35             # spoken part = frames louder than (loudest - 35 dB)
  spk_min_clips: 10            # a real speaker is used for the speaker head with >= 10 clips
  fa_subsets:                  # running speech for false alarms per hour
    dev: [dev_clean, dev_other]      # threshold choice (step 4)
    test: [test_clean, test_other]   # final numbers (never used for any choice)

split:                         # by speaker (hash of the speaker id), never by clip
  val_pct: 10
  test_pct: 10

tts:                           # scripts/03_tts.py (synthetic voices: keyword head ONLY)
  voice_prefixes: [af_, am_, bf_, bm_]   # all English voices of Kokoro v1.0
  test_voices: [af_bella, am_michael, bf_emma, bm_george]   # held out (test only)
  val_voices: [af_nicole, am_puck]                          # held out (validation only)
  blend_prob: 0.35             # a training clip uses a 2-voice blend with this probability
  speed: [0.8, 1.3]            # uniform
  clips_per_class: {help: 2500, help me: 2500, sos: 3000, _other: 5000}
  test_clips_per_class: 300    # per keyword class from the held-out voices (val: same number)
  texts:
    # Kokoro reads "SOS" / "SOS!" as one word ("sauce"), so only spelled-out forms are used;
    # phrases longer than the 1.22 s window ("Somebody help me!") are not used
    help: ["Help", "Help!", "HELP!", "help", "Help.", "Help!!", "Heelp!", "Help?"]
    help me: ["Help me", "Help me!", "HELP ME!", "help me", "Help me.", "Help me!!", "Help, me!", "Help me?"]
    sos: ["S. O. S.", "S.O.S.", "S O S", "S. O. S!", "S, O, S!", "S.O.S.!", "S-O-S!", "Ess, Oh, Ess!"]
    _other: ["Hello", "Hello!", "Health", "Held", "Helmet", "Yelp", "Self", "Hell", "Hold me", "Tell me", "Sell me",
             "Kelp", "Whelp", "Hello me", "So so", "Boss", "Sauce", "Loss", "Toss", "S. O.", "O. S.", "S. S.",
             "Ask", "Yes", "Oh yes", "Also", "Okay", "Stop", "Hey", "Please", "Hello there", "Excuse me", "Thank you",
             "Come here", "Look at me", "Call me", "Show me", "Give me that", "Let me go", "Hey you", "Oh no",
             "What's up", "Good morning", "See you soon", "Go home", "Over there", "Is anyone there?", "Everything is fine",
             "Turn left", "Battery low", "Channel two", "Roger that", "Copy that", "Over and out", "Testing, one two three",
             "Echo", "Hotel", "Oscar", "Sierra", "Seven", "Six", "Sorry", "Seriously", "Soul",
             "Sauce boss", "Help desk", "Helpful", "Helping", "Helps", "Unhelpful"]

# ------------------------------------------------------- features / windows
window:
  T: 81                        # frames per CNN window (1.62 s; CONTRACT 2 allows <= 101). 61 (1.22 s) is too short for a slow "S. O. S."
  margin_frames: 2             # keyword fully inside the window, at least this far from both ends
  p_right_edge: 0.35           # v2: share of keyword windows whose keyword ends in the last right_edge_s of the window
  right_edge_s: 0.30           #     (in a quiet room the device gate only runs the CNN while the word is in its last 240 ms)

# --------------------------------------------- Step A2: hard negatives (12_mine.py)
mine:
  model: models/kw_r1.pt       # round-1 keyword model (v2 of round 1) that looks for its own false alarms
  shards: {train_clean_360: 24, train_other_500: 16}   # LibriSpeech training shards streamed (~300 h, ~2 h of CPU)
  threshold: 0.5               # a window whose best keyword probability reaches this is a hard negative
  min_gap_s: 1.0               # at most one hard negative per second of speech
  clip_s: 2.0                  # length of a kept hard negative
  clip_after_s: 0.2            # it ends this long after the window that fired
  per_shard_max: 500           # the most confident ones per shard (diversity, disk)
  noise_per_file_max: 50       # training noise bank: at most this many per file
  fa_extra_hours: {test: 30, dev: 20}   # held-out speakers' running speech added to the false-alarm sets
  torch_threads: 4
  out: hardneg                 # data/cache/hardneg.npy / .csv
  group: hard_neg              # group names hard_neg / hard_neg_noise

mine_r3:                       # values replacing mine: for round 3 (python scripts/12_mine.py --stage r3)
  model: models/kw_r2.pt
  skip_shards: {train_clean_360: 24, train_other_500: 16}   # shards not used in round 2 (other speakers / text)
  shards: {train_clean_360: 20, train_other_500: 20}
  threshold: 0.4               # lower than round 2: the chosen thresholds are around 0.45-0.5
  noise_per_file_max: 200      # noise caused many false "help" hits in round 2
  fa_extra_hours: {test: 0, dev: 0}   # the false-alarm sets stay as they are
  out: hardneg_r3
  group: hard_neg_r3

# ---------------------------------------------------------- augmentation
augment:                       # kws/augment.py; p_* = probability per training window
  ref_level_dbfs: -25          # speech RMS level that gain_db is relative to
  gain_db: [-20, 6]            # -> speech at -45 .. -19 dBFS RMS (quiet far talker .. loud close talker)
  p_noise: 0.85
  snr_db: [0, 20]              # noise from the training noise bank (MUSAN noise/music 1-75 %, ESC-50 folds 1-4, SC background)
  noise_floor_dbfs: [-75, -55] # always: white-ish mic noise (INMP441 self noise)
  p_reverb: 0.4
  rt60_s: [0.15, 0.8]          # synthetic exponential-decay RIR
  rir_len_s: 0.5
  reverb_wet: [0.3, 1.0]
  p_speed: 0.5
  speed: [0.9, 1.1]            # resampling (tempo and pitch together)
  p_pitch: 0.3
  pitch_semitones: [-2, 2]     # phase-vocoder pitch shift (tempo kept)
  p_shout: 0.15
  shout_gain_db: [6, 18]       # then soft clipping tanh
  p_highpass: 0.7
  highpass_hz: [60, 120]       # 2nd-order Butterworth (mic / case)
  p_context: 0.25              # other running speech before / after the keyword (not overlapping)
  context_level_db: [-12, 0]   # relative to the keyword

# ------------------------------------------------------------- network
net:                           # CONTRACT 2 limits: T<=101 c1<=32 c2<=64 c3<=96 hid<=128 ncls<=8 spk_dim<=64
  c1: 16
  c2: 32
  c3: 48
  hid: 64
  spk_dim: 0                   # v1.4.1: the speaker model is separate (CONTRACT_SPK.md); round 1 had an unused 32

# ------------------------------------------------- Step 2: keyword training
train_kw:
  epochs: 50
  windows_per_epoch: 48000
  batch: 256
  class_mix: {help: 0.17, help me: 0.16, sos: 0.17, _other: 0.5}  # sampler probabilities (v1: 0.2/0.2/0.2/0.4)
  other_mix:                   # where an _other window comes from
    mswc_lookalike: 0.14
    mswc_random: 0.10
    speech_commands: 0.06
    libri_words: 0.10          # LibriSpeech look-alikes / "me" alone
    libri_chunk: 0.30          # running speech (v1: 0.18 - false alarms on running speech were far too high)
    tts_other: 0.12            # synthetic negatives (so "synthetic" never means "keyword")
    noise_only: 0.13
    silence: 0.05
  real_vs_tts: {help: 0.75, help me: 0.55, sos: 0.0}   # share of real clips per keyword (rest synthetic)
  help_me_sources: {libri_real: 0.4, joined_same_speaker: 0.6}  # among the real "help me"
  join_gap_ms: [0, 80]         # gap when joining "help" + "me" of the same speaker
  optimizer: adamw
  lr: 0.002                    # v1: 0.003 (validation jumped around while lr was high)
  weight_decay: 0.001
  schedule: onecycle           # linear warm-up from lr/div_factor, then cosine down to lr/(div_factor*final_div_factor)
  warmup_frac: 0.05
  div_factor: 25
  final_div_factor: 4          # -> last lr = lr / 100
  loss: cross_entropy
  class_weights: [1.0, 1.0, 1.0, 1.0]   # sampler is already balanced
  label_smoothing: 0.05
  val_windows_per_class: 1500
  select: val_bal_acc          # which epoch is kept: best validation balanced accuracy (round 1) or last
  norm_windows: 4000           # training windows used for in_mean / in_std
  workers: 4                   # DataLoader processes (one thread each); results do not depend on it
  torch_threads: 2             # threads of the training process

# ------------------------------------------------- Step A3: round 2 (values replacing train_kw)
train_kw_r2:
  init: models/kw_r1.pt        # fine-tune the round-1 model
  max_other_per_group: 20000   # fixed subset (hash order) of each big _other group: keeps the data in memory
  select: last                 # keep the last epoch (single-window accuracy does not measure false alarms)
  epochs: 25
  lr: 0.001                    # half the round-1 peak: fine-tuning
  warmup_frac: 0.05
  class_mix: {help: 0.17, help me: 0.16, sos: 0.17, _other: 0.5}
  other_mix:
    hard_neg: 0.25             # 12_mine.py: running speech where round 1 fired
    hard_neg_noise: 0.05       # 12_mine.py: training noise where round 1 fired
    mswc_lookalike: 0.12
    mswc_random: 0.07
    speech_commands: 0.04
    libri_words: 0.08
    libri_chunk: 0.17
    tts_other: 0.10
    noise_only: 0.08
    silence: 0.04

# ------------------------------------------------- Step A3: round 3 (values replacing train_kw)
train_kw_r3:
  init: models/kw_r2.pt        # fine-tune the round-2 model
  epochs: 20
  lr: 0.0007
  warmup_frac: 0.05
  max_other_per_group: 15000   # one more hard-negative group: smaller subsets keep the data in memory
  select: last
  class_mix: {help: 0.17, help me: 0.16, sos: 0.17, _other: 0.5}
  other_mix:
    hard_neg_r3: 0.20          # 12_mine.py --stage r3: where round 2 fired (threshold 0.4, new shards)
    hard_neg_r3_noise: 0.07    # ... in the training noise (up to 200 per file)
    hard_neg: 0.10             # round-2 hard negatives (keep them)
    hard_neg_noise: 0.03
    mswc_lookalike: 0.11
    mswc_random: 0.06
    speech_commands: 0.04
    libri_words: 0.07
    libri_chunk: 0.13
    tts_other: 0.09
    noise_only: 0.07
    silence: 0.03

# ------------------------------------------------- Step 2/4: evaluation
eval:
  context_s: 2.0               # background before / after a test keyword
  test_snr_db: [5, 20]         # "noisy" condition (test noise bank); "clean" = mic noise floor only
  test_level_dbfs: [-38, -15]  # speech RMS level of a test clip / utterance
  noise_floor_dbfs: -70        # mic self-noise added to every test stream
  noise_level_dbfs: [-45, -15] # level of the noise-only false-alarm stream (per file)
  max_per_source: 600          # test keywords per source (hash order)
  joined_help_me: 300          # joined "help"+"me" test streams (test speakers)
  hit_after_ms: 1500           # a hit up to this long after the keyword end still counts (window + smoothing)
  fa_chunk_min: 30             # false-alarm audio is processed in streams of about 30 min
  fa_noise_mix_prob: 0.5       # running speech: share of files with added noise
  fa_noise_snr_db: [5, 20]
  keyword_guard_s: 1.5         # hits this close to a real "help" in LibriSpeech are not false alarms
  thr_grid: [0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.93, 0.95, 0.97, 0.98, 0.99]

# ------------------------------------------------- Step A: system-level evaluation (20_eval.py)
eval_sys:
  sets: [real_help, real_mixed, tts_mixed, tts_help, tts_sos]   # who calls and what (see 20_eval.py)
  calls: [4, 6, 8]             # calls within window_s
  window_s: 20.0               # = hits_ms
  lead_s: 0.5                  # quiet / noise before the first call
  tail_s: 2.0                  # after the window (the last call can still be counted)
  scenarios: 100               # per set x calls x clean/noisy
  call_gain_db: [-3, 3]        # level change from call to call (one person)
  p_speed: 0.5
  speed: [0.95, 1.05]          # speaking rate change from call to call
  blame_s: 1.0                 # words said in the last second before a false hit are listed
  blame_words: 4
  blame_top: 30
  sweep_thr: [0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90]
  sweep_off: {help: [-0.15, -0.10, -0.05, 0.0], help me: [-0.05, 0.0], sos: [0.0, 0.05]}
  target_trigger_6: 0.90       # owner: >= 90 % with 6 calls
  target_false_sos_24h: 1.0    # owner: <= 1 false SOS per 24 h
  procs: 4
  torch_threads: 4

# ------------------------------------------------- Step 4: thresholds / export
export:
  model: kw_r3.pt              # the round that is exported (copied to models/best.pt with spk_dim 0)
  thr: [0.65, 0.55, 0.50]      # low / medium (default) / high sensitivity - chosen on dev (20_eval.py --sweep, r3):
                               #   medium: highest 6-call trigger rate with 0 false SOS in 32.9 h of dev audio
                               #   low: about 1.7 false single hits / h; high: more sensitive, ~2 false SOS / 24 h on dev
  cls_off: {help: -0.10, help me: 0.0, sos: 0.05}   # per class offsets: "help" (short word) lower, SOS (synthetic data only) stricter
  spk_thr: 0.70
  hits: 3
  hits_ms: 20000
  name: kws-20261023-r3
  check_windows_per_class: 100 # validation windows for the int8-vs-float check

# =====================================================================================
# Phase C - keyword model r4 (PLAN_R4.md): fewer false calls from coughs and talk.
# Scripts: 04_import_own.py, 05_download_r4.py, 06_prepare_r4.py, 13_mine_r4.py,
#          10_train_kw.py --stage r4, 21_eval_r4.py, 30_export.py --section export_r4
# =====================================================================================
r4_sources:
  vocalsound:                  # VocalSound (Gong et al., ICASSP 2022): 21 024 recordings, 3 365 speakers
    licence: CC BY-SA 4.0
    url: https://www.dropbox.com/s/c5ace70qh1vbyzb/vs_release_16k.zip?dl=1   # 1.7 GB, 16 kHz version (github.com/YuanGongND/vocalsound)
    # laughter, sigh, cough, throatclearing, sneeze, sniff; the official speaker split
    # (datafiles/tr.json, val.json, te.json) is used as train / val / test
  esc50_vocal:                 # from the ESC-50 download of Step 1 (CC-BY-NC 3.0): these classes also become _other clips
    categories: [coughing, sneezing, breathing, laughing, snoring]
    val_fold: 4                # fold 5 = test (as before), fold 4 = val, folds 1-3 = train
  ami:                         # AMI meeting corpus, headset mix (16 kHz): spontaneous English conversation
    licence: CC BY 4.0
    audio_url: https://groups.inf.ed.ac.uk/ami/AMICorpusMirror/amicorpus/{m}/audio/{m}.Mix-Headset.wav
    annotations_url: https://groups.inf.ed.ac.uk/ami/AMICorpusAnnotations/ami_public_manual_1.6.2.zip
    # meetings: AMI full-corpus-asr partition (dev / test as published; train: a part of the train list)
    train: [ES2002a, ES2002b, ES2002c, ES2002d, ES2003a, ES2003b, ES2003c, ES2003d, ES2005a, ES2005b, ES2005c, ES2005d,
            ES2006a, ES2006b, ES2006c, ES2006d, IS1000a, IS1000b, IS1000c, IS1000d, IS1001a, IS1001b, IS1001c, IS1001d,
            TS3005a, TS3005b, TS3005c, TS3005d, TS3006a, TS3006b, TS3006c, TS3006d, EN2001a, EN2001b, EN2001d, EN2001e]
    val: [ES2011a, ES2011b, ES2011c, ES2011d, IS1008a, IS1008b, IS1008c, IS1008d, TS3004a, TS3004b, TS3004c, TS3004d]
    test: [ES2004a, ES2004b, ES2004c, ES2004d, IS1009a, IS1009b, IS1009c, IS1009d, TS3003a, TS3003b, TS3003c, TS3003d,
           EN2002a, EN2002b, EN2002c, EN2002d]
  aishell:                     # AISHELL-1 (openslr 33): Mandarin speech, 400 speakers, speaker split train / dev / test
    licence: Apache-2.0
    urls:                      # the same 15 GB file on three openslr mirrors (tried in this order); streamed
      - https://www.openslr.org/resources/33/data_aishell.tgz
      - https://us.openslr.org/resources/33/data_aishell.tgz
      - https://openslr.elda.org/resources/33/data_aishell.tgz
    speakers: {train: 120, dev: 20, test: 20}      # kept per AISHELL split (hash order)
    utts_per_speaker: {train: 60, dev: 100, test: 120}

r4_prepare:                    # 06_prepare_r4.py
  event_rel_db: -30            # a vocal sound = frames louder than (loudest - 30 dB) ...
  event_min_above_floor_db: 10 # ... and this far above the recording's background
  event_merge_gap_s: 0.6       # events closer than this are one clip (a coughing fit stays together)
  event_min_s: 0.06
  event_pad_s: 0.25            # kept around an event
  event_max_s: 4.0             # longer clips are cut
  ami_chunk_s: 2.0             # AMI training audio: chunks of this length ...
  ami_chunk_every_s: 6.0       # ... one per this many seconds of meeting (hash position inside)
  keyword_guard_s: 1.0         # no AMI chunk / no false alarm counted this close to a spoken "help"
  fa_hours: {val: {ami: 6.0, aishell: 1.5}, test: {ami: 9.0, aishell: 2.5}}   # caps of the false-alarm streams
  aishell_gap_s: [0.3, 1.2]    # pause between two AISHELL utterances of a speaker in a stream
  vocal_gap_s: [1.5, 3.5]      # pause between two vocal sounds in a vocal test stream

mine_r4:                       # 13_mine_r4.py: where r3 fires on the new training audio
  model: models/kw_r3.pt
  threshold: 0.35              # best keyword probability of a window (r3's medium help threshold is 0.45, +0.05 on the device)
  min_gap_s: 1.0
  clip_s: 2.0
  clip_after_s: 0.2
  max_per_source: {chat_en: 6000, chat_zh: 4000, vocal: 6000}
  torch_threads: 8

augment_own:                   # the owner's clips are already the device microphone: lighter augmentation
  gain_db: [-10, 6]
  p_noise: 0.6
  snr_db: [5, 25]
  p_reverb: 0.15
  p_speed: 0.3
  p_pitch: 0.15
  p_shout: 0.05
  p_highpass: 0.3

train_kw_r4:                   # values replacing train_kw (10_train_kw.py --stage r4)
  init: models/kw_r3.pt        # warm start from r3
  epochs: 20
  lr: 0.0005
  warmup_frac: 0.05
  max_other_per_group: 15000
  select: last
  class_mix: {help: 0.17, help me: 0.16, sos: 0.17, _other: 0.5}
  own_share: {help: 0.25, help me: 0.25, sos: 0.35}   # share of keyword windows taken from the owner's recordings
  workers: 10                  # DataLoader processes (the laptop has 24 cores); the windows do not depend on it
  torch_threads: 4
  other_mix:
    vocal: 0.14                # VocalSound + ESC-50 vocal sounds as _other clips (new)
    hard_neg_r4: 0.12          # where r3 fired on talk / vocal sounds (new)
    chat_en: 0.07              # AMI conversation (new)
    chat_zh: 0.08              # AISHELL-1 Mandarin (new)
    hard_neg_r3: 0.11
    hard_neg_r3_noise: 0.04
    hard_neg: 0.06
    hard_neg_noise: 0.02
    mswc_lookalike: 0.07
    mswc_random: 0.04
    speech_commands: 0.02
    libri_words: 0.04
    libri_chunk: 0.07
    tts_other: 0.05
    noise_only: 0.05
    silence: 0.02

cut_help:                      # r4b: "help" with the end of the word cut off ("hel", no final /p/) as _other (kws/dataset.py cut_tail)
  own_p: 0.5                   # share of cut clips from the owner's help recordings (the rest: MSWC / LibriSpeech help)
  min_frac: 0.45               # the cut is searched in [s + 0.45 * span, e - end_guard_s] ...
  end_guard_s: 0.03
  dip_db: 6.0                  # ... at the quietest 10 ms frame (the /p/ closure) if it is 6 dB below the span median
  frac: [0.55, 0.80]           # otherwise at this fraction of the word span
  jitter_s: [0.0, 0.04]        # cut moved up to 40 ms earlier

train_kw_r4b:                  # values replacing train_kw (10_train_kw.py --stage r4b): r4 + cut "help" negatives
  init: models/kw_r4.pt        # warm start from r4
  epochs: 8
  lr: 0.0003
  warmup_frac: 0.05
  max_other_per_group: 15000
  select: last
  class_mix: {help: 0.17, help me: 0.16, sos: 0.17, _other: 0.5}
  own_share: {help: 0.15, help me: 0.15, sos: 0.25}   # r4: 0.25 / 0.25 / 0.35 - less of one voice
  workers: 10
  torch_threads: 4
  other_mix:
    cut_help: 0.08             # new in r4b
    vocal: 0.13
    hard_neg_r4: 0.11
    chat_en: 0.06
    chat_zh: 0.07
    hard_neg_r3: 0.10
    hard_neg_r3_noise: 0.03
    hard_neg: 0.05
    hard_neg_noise: 0.02
    mswc_lookalike: 0.11       # r4: 0.07 (back to r3's share: hell, held, helm, hello ...)
    mswc_random: 0.03
    speech_commands: 0.02
    libri_words: 0.03
    libri_chunk: 0.06
    tts_other: 0.04
    noise_only: 0.04
    silence: 0.02

train_kw_r4c:                  # r4b lesson: the owner's "help" and "hel" scored the same at every threshold (his /p/ is not
                               # audible in his takes) - cut negatives from his voice only pulled his "help" down (own help 100 -> 38 %)
  init: models/kw_r4.pt        # warm start from r4 (not r4b)
  epochs: 8
  lr: 0.0003
  warmup_frac: 0.05
  max_other_per_group: 15000
  select: last
  class_mix: {help: 0.17, help me: 0.16, sos: 0.17, _other: 0.5}
  own_share: {help: 0.25, help me: 0.25, sos: 0.35}   # as r4
  cut_help: {own_p: 0.0}       # cut "help" only from MSWC / LibriSpeech (r4b: half from the owner)
  workers: 10
  torch_threads: 4
  other_mix:
    cut_help: 0.05             # r4b: 0.08
    vocal: 0.13
    hard_neg_r4: 0.11
    chat_en: 0.07
    chat_zh: 0.07
    hard_neg_r3: 0.10
    hard_neg_r3_noise: 0.04
    hard_neg: 0.05
    hard_neg_noise: 0.02
    mswc_lookalike: 0.10
    mswc_random: 0.03
    speech_commands: 0.02
    libri_words: 0.04
    libri_chunk: 0.06
    tts_other: 0.05
    noise_only: 0.04
    silence: 0.02

eval_r4:                       # 21_eval_r4.py - everything with the firmware v1.6.7 detector (kws/fwdet.py)
  device: {sens: 1, rule: 0, help_extra: 0.05}     # v1.6.7 defaults: medium, 2 calls within 10 s, help +0.05 / no relax
  lead_s: 1.0                  # quiet (mic noise) before a call
  tail_s: 2.0
  noise_floor_dbfs: -70
  call_level_dbfs: [-34, -18]  # public keyword clips are set to this level (the owner's are used as recorded)
  pair_gap_s: [0.6, 2.5]       # two calls of a pair (SOS needs 2 within 10 s)
  max_per_set: 400             # keyword clips per set (hash order)
  pairs_per_set: 200
  sos_calls: {0: 2, 1: 4, 2: 2}   # calls in a row of one caller for the SOS rate: rule 0 / 2 need 2 (within 10 s), rule 1 needs 3 of them (within 20 s) - 4 calls are made
  libri_hours: {val: 3.0, test: 6.0}   # the old LibriSpeech false-alarm speech also run (30 min streams)
  fa_noise_prob: 0.5           # share of false-alarm streams with test noise added
  fa_noise_snr_db: [5, 20]
  procs: 8
  sweep_med_thr: [0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85]   # r4 run 1: the best row was at the old edge 0.70
  sweep_help_extra: [0.0, 0.05, 0.10]
  low_minus_med: 0.10          # low = medium + 0.10, high = medium - 0.05 (as r3: 0.65 / 0.55 / 0.50)
  high_minus_med: -0.05
  target_false_sos_24h: 1.0    # on the val talk streams
  target_cough_factor: 5.0     # r4 false hits on coughs at least 5x fewer than r3 (test)

export_r4:                     # 30_export.py --section export_r4 (thresholds filled in after 21_eval_r4.py --sweep)
  model: kw_r4.pt
  thr: [0.80, 0.70, 0.65]      # val sweep: no setting reached <= 1 false SOS/24 h; this row has the lowest (8.9/24 h)
  cls_off: {help: -0.10, help me: 0.0, sos: 0.05}
  help_extra: 0.05             # val sweep: same false SOS as 0.10 but higher mean hit rate
  spk_thr: 0.70
  hits: 3
  hits_ms: 20000
  name: kws-r4
  check_windows_per_class: 100

export_r4b:                    # 30_export.py --section export_r4b (same device settings as r4 unless the val sweep says otherwise)
  model: kw_r4b.pt
  thr: [0.80, 0.70, 0.65]      # = export_r4 (medium 0.70, chosen by the owner); the r4b val sweep is reported, the owner decides
  cls_off: {help: -0.10, help me: 0.0, sos: 0.05}
  help_extra: 0.05
  spk_thr: 0.70
  hits: 3
  hits_ms: 20000
  name: kws-r4b
  check_windows_per_class: 100

export_r4c:                    # 30_export.py --section export_r4c (same device settings as r4 unless the owner decides otherwise)
  model: kw_r4c.pt
  thr: [0.80, 0.70, 0.65]
  cls_off: {help: -0.10, help me: 0.0, sos: 0.05}
  help_extra: 0.05
  spk_thr: 0.70
  hits: 3
  hits_ms: 20000
  name: kws-r4c
  check_windows_per_class: 100
